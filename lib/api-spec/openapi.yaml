  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get appointment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchAppointment
      tags: [appointments]
      summary: Update appointment status, reschedule, or alter in-place
      description: >
        Accepts 4 payload formats:
        1. Cancel: { status: "CANCELLED", reason?: string }
        2. Status change: { status: "IN_PROGRESS" | "COMPLETED" | "NO_SHOW" }
        3. Reschedule: { reschedule: { startDatetime, resourceId?, addressId? } }
        4. Alter in-place: { startDatetime?, professionalId?, modality?, addressId? }
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAppointmentRequest"
      responses:
        "200":
          description: Appointment updated (or reschedule returns cancelled + new)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchAppointmentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
