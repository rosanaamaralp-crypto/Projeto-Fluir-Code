          schema:
            type: string
          required: false
          description: Filter by date in YYYY-MM-DD format (UTC)
        - in: query
          name: clientId
          schema:
            type: string
          required: false
        - in: query
          name: professionalId
          schema:
            type: string
          required: false
      responses:
