components:
  schemas:
    # ── Health ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    LoginUser:
      type: object
      description: >
        User returned by POST /auth/login.
        Note: uses "id" (not "userId"). phone and lastLoginAt are nullable.
      properties:
        id:
          type: string
        roleId:
          type: number
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        status:
          type: string
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - roleId
        - name
        - email
        - status
        - createdAt
        - updatedAt

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/LoginUser"
      required:
        - user

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    SessionUser:
      type: object
      description: >
        Session user returned by GET /auth/me.
        Note: uses "userId" (not "id") — this is the session data shape.
      properties:
        userId:
          type: string
        roleId:
          type: number
        name:
          type: string
        email:
          type: string
      required:
        - userId
        - roleId
        - name
        - email

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
      required:
        - user

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error

    # ── Admin dashboard ───────────────────────────────────────────────────────
    ResourceOccupancy:
      type: object
      properties:
        resourceId:
          type: string
        resourceName:
          type: string
        appointmentsToday:
          type: number
      required:
        - resourceId
        - resourceName
        - appointmentsToday

    AdminDashboard:
      type: object
      properties:
        appointmentsToday:
          type: number
        upcomingAppointments:
          type: number
        completedToday:
          type: number
        cancelledToday:
          type: number
        homeCareToday:
          type: number
        resourceOccupancy:
          type: array
          items:
            $ref: "#/components/schemas/ResourceOccupancy"
      required:
        - appointmentsToday
        - upcomingAppointments
        - completedToday
        - cancelledToday
        - homeCareToday
        - resourceOccupancy

    AdminDashboardResponse:
      type: object
      properties:
        dashboard:
          $ref: "#/components/schemas/AdminDashboard"
      required:
        - dashboard

    # ── Professional dashboard ────────────────────────────────────────────────
    NextAppointmentProfessional:
      type: object
      properties:
        id:
          type: string
        startDatetime:
          type: string
          format: date-time
        clientName:
          type: string
          nullable: true
        serviceName:
          type: string
          nullable: true
        modality:
          type: string
        resourceName:
          type: string
          nullable: true
      required:
        - id
        - startDatetime
        - modality

    UpcomingAppointmentProfessional:
      type: object
      properties:
        id:
          type: string
        startDatetime:
          type: string
          format: date-time
        clientName:
          type: string
          nullable: true
        serviceName:
          type: string
          nullable: true
        modality:
          type: string
      required:
        - id
        - startDatetime
        - modality

    ProfessionalDashboard:
      type: object
      properties:
        nextAppointment:
          allOf:
            - $ref: "#/components/schemas/NextAppointmentProfessional"
          nullable: true
        upcomingAppointments:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingAppointmentProfessional"
        appointmentsToday:
          type: number
        completedToday:
          type: number
        cancelledToday:
          type: number
      required:
        - upcomingAppointments
        - appointmentsToday
        - completedToday
        - cancelledToday

    ProfessionalDashboardResponse:
      type: object
      properties:
        dashboard:
          $ref: "#/components/schemas/ProfessionalDashboard"
      required:
        - dashboard

    # ── Client dashboard ──────────────────────────────────────────────────────
    NextAppointmentClient:
      type: object
      properties:
        id:
          type: string
        startDatetime:
          type: string
          format: date-time
        professionalName:
          type: string
          nullable: true
        serviceName:
          type: string
          nullable: true
        modality:
          type: string
      required:
        - id
        - startDatetime
        - modality

    ClientDashboard:
      type: object
      properties:
        nextAppointment:
          allOf:
            - $ref: "#/components/schemas/NextAppointmentClient"
          nullable: true
        upcomingAppointments:
          type: array
          items:
            $ref: "#/components/schemas/NextAppointmentClient"
        pastAppointmentsCount:
          type: number
      required:
        - upcomingAppointments
        - pastAppointmentsCount

    ClientDashboardResponse:
      type: object
      properties:
        dashboard:
          $ref: "#/components/schemas/ClientDashboard"
      required:
        - dashboard

    # ── Clients ───────────────────────────────────────────────────────────────
    ClientRow:
      type: object
      description: >
        Client record joined with users table — includes name, email, phone.
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        birthDate:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - email
        - status
        - createdAt
        - updatedAt

    UserRow:
      type: object
      description: User record (name/email/phone stored here, not in clients/professionals).
      properties:
        id:
          type: string
        roleId:
          type: number
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - roleId
        - name
        - email
        - status
        - createdAt
        - updatedAt

    CreateClientRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        birthDate:
          type: string
        notes:
          type: string
      required:
        - name
        - email
        - password

    CreateClientResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserRow"
        client:
          $ref: "#/components/schemas/ClientRow"
      required:
        - user
        - client

    UpdateClientRequest:
      type: object
      properties:
        birthDate:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string

    ClientResponse:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/ClientRow"
      required:
        - client

    ClientsListResponse:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientRow"
      required:
        - clients

    # ── Addresses ─────────────────────────────────────────────────────────────
    AddressRow:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
          nullable: true
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        reference:
          type: string
          nullable: true
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - street
        - number
        - neighborhood
        - city
        - state
        - postalCode
        - isDefault
        - createdAt
